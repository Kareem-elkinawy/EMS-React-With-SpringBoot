apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-backend
  namespace: ems
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-backend
  template:
    metadata:
      labels:
        app: auth-backend
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: auth-backend
          securityContext:
            allowPrivilegeEscalation: false
          image: emsdevopsacr.azurecr.io/ems-auth-backend:latest
          ports:
            - containerPort: 5001
          readinessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 20
            periodSeconds: 20
          env:
            - name: MONGO_DB_URL
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: MONGODB_URI

---
apiVersion: v1
kind: Service
metadata:
  name: auth-backend
  namespace: ems
spec:
  selector:
    app: auth-backend
  ports:
    - port: 5001
      targetPort: 5001
  type: ClusterIP
