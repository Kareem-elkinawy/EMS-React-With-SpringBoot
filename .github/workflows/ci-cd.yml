name: EMS CI/CD

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:

  # =========================
  # 1. Frontend CI
  # =========================
  frontend:
    name: Frontend - Build & Lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/Emp-React

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/Emp-React/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build


  # =========================
  # 2. Spring Boot CI
  # =========================
  employee:
    name: Employee - Build & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: employee

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Build & Test
        run: ./mvnw clean verify


  # =========================
  # 3. Auth Backend CI
  # =========================
  auth-backend:
    name: Auth Backend - Build & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check Node application
        run: node --check server.mjs


  # =========================
  # 4. Docker Build
  # =========================
  docker-build:
    name: Docker - Build Images
    runs-on: ubuntu-latest

    needs:
      - frontend
      - employee
      - auth-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Frontend image
        run: |
          docker build \
            -t ems-frontend:test \
            ./src/Emp-React

      - name: Build Employee image
        run: |
          docker build \
            -t ems-employee:test \
            ./employee

      - name: Build Auth Backend image
        run: |
          docker build \
            -t ems-auth-backend:test \
            ./Backend

      - name: Show Docker images
        run: docker images
